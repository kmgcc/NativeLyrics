name: macOS Swift Package

on:
  push:
  pull_request:

jobs:
  package:
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Validate package manifest
        run: swift package dump-package >/dev/null
      - name: Build all products (debug, warnings as errors)
        run: swift build --configuration debug -Xswiftc -warnings-as-errors
      - name: Build all products (release, warnings as errors)
        run: swift build --configuration release -Xswiftc -warnings-as-errors
      - name: Run tests
        run: swift test --configuration debug
      - name: Probe smoke (real scale)
        run: swift run --quiet MelismaKitProbe --scale 120 --paused /tmp/melismakit-probe-ci 10 760 720
      - name: Verify fixture corpus integrity
        run: swift run --quiet MelismaKitBench --verify-fixtures
      - name: Performance gate (Phase 0 thresholds)
        run: |
          swift run -c release --quiet MelismaKitBench --scale 120 --json > /tmp/melismakit-bench.json
          python3 script/bench_gate.py /tmp/melismakit-bench.json
